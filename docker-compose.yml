services:
  app:
    image: energy-management:dev
    build:
      context: .
      target: deps
    working_dir: /app
    command: npm run dev -- --webpack
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
